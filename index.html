<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Profile | Ambient</title>
    <style>
        :root {
            --bg-color: #e8dfd5;
            --surface: #f2ebe1;
            --text-main: #4a443f;
            --text-muted: #8c837a;
            --accent: #c4b3a3;
            --shadow-dark: rgba(0, 0, 0, 0.12);
            --shadow-light: rgba(255, 255, 255, 0.8);
            --active-color: #a8d5ba; 
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .grain {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
            opacity: 0.04;
            background-image: url('https://grainy-gradients.vercel.app/noise.svg');
        }

        .system-status-card {
            position: absolute;
            top: 30px;
            right: 30px;
            background: var(--surface);
            padding: 12px 24px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 
                10px 10px 30px var(--shadow-dark),
                -10px -10px 30px var(--shadow-light);
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-led {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--active-color);
            box-shadow: 0 0 4px var(--active-color);
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .dashboard {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 40px;
            width: 95%;
            max-width: 1200px;
            padding: 40px;
            background: var(--surface);
            border-radius: 48px;
            box-shadow: 
                30px 30px 60px var(--shadow-dark),
                -30px -30px 60px var(--shadow-light);
            border: 1px solid rgba(255, 255, 255, 0.5);
            position: relative;
            z-index: 1;
            align-items: stretch;
        }

        .profile-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border-right: 1px solid rgba(0,0,0,0.05);
            padding-right: 40px;
        }

        .profile-pic {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 24px;
            border: 8px solid var(--bg-color);
            box-shadow: 
                inset 0 0 15px var(--shadow-dark),
                0 15px 30px var(--shadow-dark);
        }

        h1 { font-size: 28px; margin: 0 0 10px 0; font-weight: 600; }
        .subtitle { color: var(--text-muted); font-size: 16px; margin-bottom: 30px; line-height: 1.4; }

        .segmented-control {
            display: flex;
            background: var(--bg-color);
            padding: 5px;
            border-radius: 15px;
            box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
            justify-content: center;
            margin-bottom: 24px;
        }

        .segment {
            padding: 8px 20px;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.2s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .segment.active {
            background: var(--surface);
            box-shadow: 2px 2px 5px var(--shadow-dark), -2px -2px 5px var(--shadow-light);
            color: var(--text-main);
        }

        .content-display {
            width: 100%;
            min-height: 150px;
            padding: 24px;
            background: var(--bg-color);
            border-radius: 24px;
            box-shadow: inset 4px 4px 10px var(--shadow-dark), inset -4px -4px 10px var(--shadow-light);
            
            /* Technical Dossier Style */
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.8;
            color: var(--text-main);
            text-align: left;
            box-sizing: border-box;
            transition: opacity 0.3s ease, transform 0.3s ease;
            
            /* Log line accent */
            border-left: 3px solid var(--accent);
        }

        .content-display a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px solid var(--accent);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .content-display a:hover {
            color: var(--active-color);
            border-bottom-color: var(--active-color);
        }

        .controls-panel {
            display: flex;
            justify-content: center;
            align-items: stretch;
        }

        .component-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 40px 20px;
            background: var(--bg-color);
            border-radius: 24px;
            box-shadow: inset 4px 4px 10px var(--shadow-dark), inset -4px -4px 10px var(--shadow-light);
            width: 100%;
            max-width: 400px;
            min-height: 450px; 
            box-sizing: border-box;
        }

        .group-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 20px;
            font-weight: 700;
            text-align: center;
        }

        .toggle-container {
            display: flex;
            flex-direction: column;
            gap: 60px; 
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }

        .toggle-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .toggle {
            width: 50px;
            height: 26px;
            background: #d1cdc7;
            border-radius: 13px;
            position: relative;
            cursor: pointer;
            box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
            transition: background 0.3s ease;
        }

        .toggle::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: var(--surface);
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 2px 2px 5px var(--shadow-dark);
        }

        .toggle.active { background: var(--active-color); }
        .toggle.active::before { transform: translateX(24px); }

        .toggle-text {
            font-size: 13px;
            color: var(--text-muted);
            max-height: 0;
            overflow: hidden;
            transition: all 0.3s ease;
            opacity: 0;
            text-align: center;
            padding: 0 10px;
        }

        .toggle-text.visible {
            max-height: 120px;
            opacity: 1;
            margin-top: 5px;
        }

        .toggle-text a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px solid var(--accent);
        }

        .toggle-text a:hover {
            color: var(--active-color);
            border-bottom-color: var(--active-color);
        }

    </style>
</head>
<body id="main-body">
    <div class="grain"></div>
    
    <div class="system-status-card">
        <div class="status-item">
            <div class="status-led"></div>
            <span>System: Online</span>
        </div>
        <div class="status-item">
            <span>View: <span id="status-view">About</span></span>
        </div>
        <div class="status-item">
            <span id="status-ip">IP: Loading...</span>
        </div>
    </div>
    
    <div class="dashboard">
        <div class="profile-panel">
            <img src="c570158b-df85-4cc2-947c-1999bb8dffdb.png" alt="Profile" class="profile-pic">
            <h1>Selebren</h1>
            <p class="subtitle">AI Researcher & Digital Architect<br>Interactive Physics & Motion<br>AI-Driven Research<br>Systemic Automation</p>
            
            <div class="segmented-control">
                <div class="segment active" onclick="setSegment(this, 'about')">О себе</div>
                <div class="segment" onclick="setSegment(this, 'works')">Работы</div>
                <div class="segment" onclick="setSegment(this, 'contact')">Связь</div>
            </div>

            <div class="content-display" id="dynamic-content">
                <!-- Content populated by JS -->
            </div>
        </div>

        <div class="controls-panel">
            <div class="component-group">
                <div class="group-label">Settings</div>
                <div class="toggle-container">
                    <div class="toggle-item">
                        <div class="toggle" onclick="toggleText(this)"></div>
                        <div class="toggle-text">
                            Дополнительная информация о профиле активирована.<br>
                            Ссылка на моё резюме в <a href="https://novosibirsk.hh.ru/resume/e511df4bff08cd1a080039ed1f4370694b724e?hhtmFrom=applicant_profile&print=true" target="_blank">HH</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const contents = {
            about: "Администратор систем, сервисов, проектов и чужих душ",
            works: '<a href="https://github.com/SelebrenMaster/SMB-Downloader-v3" target="_blank">SMB-Downloader v3</a>',
            contact: '<a href="https://t.me/Selebren" target="_blank">Telegram</a>'
        };

        async function fetchIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                document.getElementById('status-ip').innerText = `IP: ${data.ip}`;
            } catch (e) {
                document.getElementById('status-ip').innerText = 'IP: Error';
            }
        }
        fetchIP();

        function setSegment(el, key) {
            document.querySelectorAll('.segment').forEach(s => s.classList.remove('active'));
            el.classList.add('active');
            
            const viewMap = { 'about': 'About', 'works': 'Works', 'contact': 'Contact' };
            document.getElementById('status-view').innerText = viewMap[key];

            const display = document.getElementById('dynamic-content');
            display.style.opacity = 0;
            display.style.transform = 'translateY(10px)';
            
            setTimeout(() => {
                display.innerHTML = contents[key];
                display.style.opacity = 1;
                display.style.transform = 'translateY(0)';
            }, 200);
        }

        document.getElementById('dynamic-content').innerHTML = contents.about;

        function toggleText(el) {
            el.classList.toggle('active');
            const text = el.nextElementSibling;
            text.classList.toggle('visible');
        }
    </script>
</body>
</html>
